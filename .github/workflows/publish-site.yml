name: Publish Xponent website

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Site release version (major.minor.patch)'
        required: true
        default: '0.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download approved static package
        env:
          GH_TOKEN: ${{ secrets.XPO_SITE_READ_TOKEN }}
          GH_REPO: nishkodotco/app.xponent.site
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid semantic version'; exit 1; }
          test -n "$GH_TOKEN" || { echo 'Configure XPO_SITE_READ_TOKEN with Contents: read access to app.xponent.site'; exit 1; }
          mkdir package website
          gh release download "$VERSION" --pattern "xponent-site-$VERSION.tar.gz*" --dir package
          (cd package && sha256sum --check "xponent-site-$VERSION.tar.gz.sha256")
          tar -xzf "package/xponent-site-$VERSION.tar.gz" -C website
          test -s website/index.html
          test -s website/.nojekyll || touch website/.nojekyll
          python3 -c 'import json,os; d=json.load(open("website/release.json")); assert d["version"] == os.environ["VERSION"]'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: PRD
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
